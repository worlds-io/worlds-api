version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # Every github/codeql-action step (init, analyze, ...) must run the same version, so
      # bump them together in one PR. Separate PRs each fail CodeQL on the version mismatch.
      codeql-action:
        patterns:
          - "github/codeql-action*"
  - package-ecosystem: "maven"
    # No aggregator pom at the repo root: java/ and java-client/ are separate Maven projects.
    directories:
      - "/java"
      - "/java-client"
    schedule:
      interval: "weekly"
